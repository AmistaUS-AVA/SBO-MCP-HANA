# SAP MCP Server Configuration - SQL Server Example
# Copy this file to config.yaml and fill in your details

# ============================================
# EXAMPLE 1: SQL Server with SQL Authentication
# ============================================
server:
  name: sql-server
  prefix: sql                             # Tools will be: sql_get_tables, sql_get_columns, sql_run_query
  version: "1.0"
  http_port: 8088                         # HTTP port for remote access (ngrok)

connector:
  type: odbc
  connection_string: "Driver={ODBC Driver 17 for SQL Server};Server=localhost;Database=AdventureWorks;UID=sa;PWD=YourPassword123"

# Optional: Limit to specific tables (empty = all tables)
tables: []

# Optional: Enable debug logging
# log_file: C:/Logs/mcp-server.log


