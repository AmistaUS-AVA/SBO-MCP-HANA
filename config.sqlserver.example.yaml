# ============================================
# DRIVER REFERENCE
# ============================================
# Common SQL Server ODBC drivers:
#   - {ODBC Driver 18 for SQL Server}  (Latest, recommended for new installs)
#   - {ODBC Driver 17 for SQL Server}  (Most widely deployed)
#   - {ODBC Driver 13 for SQL Server}
#   - {SQL Server Native Client 11.0}  (Legacy)
#   - {SQL Server}                      (Very old, not recommended)
#
# To list installed ODBC drivers on Windows:
#   - Open ODBC Data Sources (64-bit) from Start Menu
#   - Or run: odbcconf /a {listdrivers}
#
# To install ODBC Driver 17:
#   - Download from: https://docs.microsoft.com/en-us/sql/connect/odbc/download-odbc-driver-for-sql-server


# ============================================
# CONNECTION STRING OPTIONS
# ============================================
# Server formats:
#   - localhost                         Local default instance
#   - localhost\SQLEXPRESS              Named instance
#   - 192.168.1.100,1433                IP with port
#   - tcp:server.database.windows.net   Azure SQL
#
# Authentication:
#   - UID=user;PWD=password             SQL Server authentication
#   - Trusted_Connection=yes            Windows integrated authentication
#
# Security:
#   - Encrypt=yes                       Force encryption
#   - TrustServerCertificate=yes        Accept self-signed certs (dev only!)
#   - TrustServerCertificate=no         Validate server certificate (production)
#
# Timeout:
#   - Connection Timeout=30             Connection timeout in seconds
#   - Command Timeout=60                Query timeout in seconds
